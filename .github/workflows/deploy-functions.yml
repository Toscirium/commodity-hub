name: Deploy Supabase Edge Functions

# Edge functions are the one part of this repo that merging does not ship.
# The web bundle deploys itself via Vercel on every push to main; the
# functions needed someone to run `supabase functions deploy` by hand, so
# fixes sat merged-but-dead — including, for several days, a wrong WTI
# price on the front page.
#
# REQUIRED BEFORE THIS CAN RUN: a repository secret named
# SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
# Generate one at https://supabase.com/dashboard/account/tokens.
# Until that exists every run fails fast with a message saying so.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names, or "all". Leave empty to deploy only what changed.'
        required: false
        default: ''

# Never let two deploys race. Queue rather than cancel: a half-applied
# deploy that got cancelled mid-flight is worse than waiting.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to diff against for changed-function detection.
          fetch-depth: 2

      # Reads the token from either store and under either common spelling,
      # then says which one it found. A repository secret arriving empty has
      # a small set of causes and they are indistinguishable from the error
      # alone, so the job reports what it can actually see rather than making
      # someone guess. Only presence is ever printed, never a value.
      - name: Resolve the access token
        id: token
        env:
          S_PRIMARY: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          S_ALT: ${{ secrets.SUPABASE_TOKEN }}
          V_PRIMARY: ${{ vars.SUPABASE_ACCESS_TOKEN }}
          # Names only. jq prints the keys; the values never leave this
          # variable, and the runner masks them regardless.
          SECRET_NAMES_JSON: ${{ toJSON(secrets) }}
          VAR_NAMES_JSON: ${{ toJSON(vars) }}
        run: |
          set -uo pipefail
          report() { [ -n "${2:-}" ] && echo "  $1: set" || echo "  $1: empty"; }
          echo "Token sources visible to this job:"
          report "secrets.SUPABASE_ACCESS_TOKEN" "${S_PRIMARY:-}"
          report "secrets.SUPABASE_TOKEN       " "${S_ALT:-}"
          report "vars.SUPABASE_ACCESS_TOKEN   " "${V_PRIMARY:-}"

          TOKEN="${S_PRIMARY:-}"
          [ -z "$TOKEN" ] && TOKEN="${S_ALT:-}"
          [ -z "$TOKEN" ] && TOKEN="${V_PRIMARY:-}"

          if [ -z "$TOKEN" ]; then
            # Checking two spellings was not enough to tell "absent" from
            # "present under a name I did not guess", so list what this job can
            # actually reach. Keys only — no values are printed.
            echo "Repository secrets visible to this job:"
            printf '%s' "$SECRET_NAMES_JSON" | jq -r 'keys[] | "  - " + .' || echo "  (could not parse)"
            echo "Repository variables visible to this job:"
            printf '%s' "$VAR_NAMES_JSON" | jq -r 'keys[] | "  - " + .' || echo "  (could not parse)"

            echo "::error::No Supabase access token reached this job. If SUPABASE_ACCESS_TOKEN is absent from the list above, it is not a repository secret on Toscirium/commodity-hub — the usual cause is that it was added to the Environment secrets list rather than the Repository secrets list (those are separate lists on the same settings page, and an environment secret needs an environment declared on the job before it is visible). Other possibilities: it went to a different repository, or to account-level settings. If it IS in the list above under a different spelling, tell me the name and I will match it."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve project ref
        id: ref
        run: |
          # Read from config.toml rather than duplicating it in a secret —
          # the project ref is not sensitive and it is already committed.
          REF=$(grep -oP '(?<=^project_id = ")[^"]+' supabase/config.toml)
          if [ -z "$REF" ]; then
            echo "::error::Could not read project_id from supabase/config.toml"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Project ref: $REF"

      - name: Decide which functions to deploy
        id: pick
        env:
          REQUESTED: ${{ github.event.inputs.functions }}
        run: |
          set -euo pipefail
          all_functions() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              -not -name '_shared' -printf '%f\n' | sort
          }

          if [ "$REQUESTED" = "all" ]; then
            echo "Manual dispatch: deploying every function."
            LIST=$(all_functions)
          elif [ -n "$REQUESTED" ]; then
            echo "Manual dispatch: deploying the requested list."
            LIST=$(printf '%s\n' $REQUESTED | sort -u)
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- supabase/functions supabase/config.toml || true)
            echo "Changed paths:"; echo "$CHANGED"

            # Every function in this repo imports from _shared/, and the CLI
            # bundles shared code into each function at deploy time — so a
            # _shared change that is not fanned out leaves 45 functions
            # running last week's copy of it. config.toml carries per-function
            # verify_jwt, so it fans out too.
            if echo "$CHANGED" | grep -qE '^supabase/(functions/_shared/|config\.toml$)'; then
              echo "Shared code or config changed — fanning out to every function."
              LIST=$(all_functions)
            else
              LIST=$(echo "$CHANGED" \
                | grep -oP '(?<=^supabase/functions/)[^/]+' \
                | grep -v '^_shared$' | sort -u || true)
            fi
          fi

          if [ -z "$LIST" ]; then
            echo "Nothing to deploy."
          fi
          echo "Will deploy:"; echo "$LIST"
          {
            echo 'list<<EOF'
            echo "$LIST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # `supabase functions deploy` takes verify_jwt from config.toml, and
      # where a function has no entry it applies the CLI default of
      # verify_jwt = true. 23 of the 46 functions in this repo currently have
      # no entry, so an unguarded deploy would silently switch authentication
      # on for them — including fetch-commodity-symbols, the endpoint the
      # whole markets list hangs off, which is written for optional auth and
      # serves guests.
      #
      # That is a change nobody would see in a diff and everybody would see in
      # production, so it fails the run instead. Declaring the function in
      # config.toml is the fix; the value is a deliberate decision per
      # function, not something to default into.
      - name: Pre-flight — every function being deployed must declare verify_jwt
        env:
          LIST: ${{ steps.pick.outputs.list }}
        run: |
          set -uo pipefail
          MISSING=""
          while read -r fn; do
            [ -z "$fn" ] && continue
            grep -q "^\[functions\.$fn\]" supabase/config.toml || MISSING="$MISSING $fn"
          done <<< "$LIST"

          if [ -n "$MISSING" ]; then
            echo "::error::These functions have no [functions.<name>] block in supabase/config.toml, so deploying them would apply the CLI default verify_jwt=true and may change their authentication:$MISSING"
            echo "::error::Add an explicit verify_jwt for each before deploying it."
            exit 1
          fi
          echo "All functions in this deploy declare verify_jwt."

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
          REF: ${{ steps.ref.outputs.ref }}
          LIST: ${{ steps.pick.outputs.list }}
        run: |
          set -uo pipefail
          if [ -z "${LIST// /}" ]; then
            echo "No functions to deploy — nothing to do."
            exit 0
          fi

          # Deployed one at a time, continuing past a failure, so one bad
          # function cannot silently strand the rest half-shipped. The job
          # still fails at the end if anything failed.
          FAILED=""
          while read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::Deploying $fn"
            if supabase functions deploy "$fn" --project-ref "$REF"; then
              echo "$fn ok"
            else
              echo "::error::Failed to deploy $fn"
              FAILED="$FAILED $fn"
            fi
            echo "::endgroup::"
          done <<< "$LIST"

          if [ -n "$FAILED" ]; then
            echo "::error::Failed:$FAILED"
            exit 1
          fi
          echo "All functions deployed."
