// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Bumped from 8.9.1 for Play Console's R8/resource-shrinking
        // optimization request. Deliberately staying within the 8.x line
        // rather than jumping to 9.0+ — AGP 9.0 is a breaking-change major
        // version (new DSL, removes applicationVariants) that explicitly
        // calls out Firebase/RevenueCat/social-login-style plugins as
        // commonly incompatible, all of which this project uses, and there's
        // no way to test-build that jump in this environment. 8.13.2 is the
        // latest 8.x patch and gets android.r8.optimizedResourceShrinking
        // (see gradle.properties) without that risk.
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
